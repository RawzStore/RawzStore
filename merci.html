<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Merci pour ta commande — Rawz Store</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="https://rawz.store/images/favicon.png">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    .merci-wrap { max-width: 560px; margin: 60px auto; padding: 0 18px; text-align: center; }
    .merci-box { border: 1px solid var(--border-color); background: var(--card-bg); padding: 36px 24px; border-radius: 2px; }
    .merci-check { font-size: 2.4rem; color: #6fcf97; margin-bottom: 14px; }
    .merci-box h1 { font-size: 1.1rem; letter-spacing: .18em; text-transform: uppercase; margin-bottom: 14px; }
    .merci-box p { color: var(--gray-text); margin-bottom: 14px; }
    .merci-num { margin: 22px 0; padding: 14px; background: var(--gray-light); border: 1px solid var(--border-color); }
    .merci-num span { display: block; font-size: .68rem; letter-spacing: .16em; text-transform: uppercase; color: var(--gray-text); }
    .merci-num strong { font-size: 1.4rem; letter-spacing: .12em; }
  </style>
</head>
<body>
  <header class="navbar">
    <div class="nav-container">
      <span></span>
      <a href="index.html" class="brand-logo" aria-label="Retour à l'accueil RAWZ">
        <img src="images/logo.png" alt="RAWZ Logo" class="logo-img">
      </a>
      <span></span>
    </div>
  </header>

  <main class="merci-wrap">
    <div class="merci-box">
      <div class="merci-check"><i class="fa-solid fa-circle-check"></i></div>
      <h1>Merci pour ta commande !</h1>
      <p>Ton paiement est validé.</p>

      <div class="merci-num" id="merci-num" hidden>
        <span>Numéro de commande</span>
        <strong id="merci-num-val"></strong>
      </div>

      <p>Un e-mail de confirmation vient de t'être envoyé. Pense à vérifier tes spams si tu ne le vois pas.</p>
      <a href="index.html" class="cta-btn">Retour à la boutique</a>
    </div>
  </main>

  <script>
    (function () {
      // Le paiement est validé : on vide le panier
      try { localStorage.removeItem('rawz_cart'); } catch (e) {}

      // Même formule que côté serveur (api/_lib.js) : RAWZ- + 8 derniers caractères de la session Stripe
      var sid = new URLSearchParams(location.search).get('session_id') || '';
      if (sid.length >= 8) {
        document.getElementById('merci-num-val').textContent = 'RAWZ-' + sid.slice(-8).toUpperCase();
        document.getElementById('merci-num').hidden = false;
      }
    })();
  </script>
</body>
</html>
